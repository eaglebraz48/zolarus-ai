[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[scheduled.functions]]
  function = "reminders-check"
  cron = "*/5 * * * *"

[build.environment]
  NODE_VERSION = "20.12.2"

[blobs]
enabled = false
